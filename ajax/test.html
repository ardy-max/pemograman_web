<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo AJAX & Web Service</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #89f7fe, #66a6ff);
      color: #333;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
    }

    #content {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      width: 80%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .card {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: 0.2s;
    }

    .card:hover {
      background: #e9f5ff;
    }
  </style>
</head>

<body>

  <h1>Demo AJAX</h1>
  <p>Random Data Pengguna dari Web Service</p>
  <button id="loadBtn">Generate Data Pengguna</button>

  <div class="loader" id="loader"></div>

  <div id="content">
    <p>Data pengguna berikut:...</p>
  </div>

  <script>
    const btn = document.getElementById("loadBtn");
    //mendeklarasikan button untuk load data
    const content = document.getElementById("content");
    //mendeklarasikan content untuk menampilkan data
    const loader = document.getElementById("loader");
    //mendeklarasikan loader untuk menampilkan loading
    btn.addEventListener("click", async () => {
      //menampilkan konten
      loader.style.display = 'block';
      content.innerHTML = '';

      try {
        //mengambil data dari JSONlacehlder dan dikembalikan dalam format JSON
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        if (!response.ok) throw new Error('Gagal mengambil data');
        //Memeriksa apakah data berhasil diambil
        const users = await response.json();

        loader.style.display = 'none';
        content.innerHTML += '<h3>list Pengguna:</h3>';
        users.slice(0, 5).forEach(user => {
          const div = document.createElement("div");
          div.classList.add("card");
          div.innerHTML = `<strong>${user.name}</strong><br><em>${user.email}</em><br>
          ${user.address.city}`;
          content.appendChild(div);
        });
      } catch (error) {
        loader.style.display = 'none';
        content.innerHTML = '<p style ="color:red;"> Terjadi Error:${error.message} </p>'
      }
    }
    );
  </script>

</body>

</html>
